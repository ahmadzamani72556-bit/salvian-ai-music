name: Build SALVIAN AI MUSIC

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Apply Music 2.5 + Suno locks once
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Run music lock script')
        run: |
          node scripts/patch-eleven-music.mjs
          git config user.name "salvian-ai-bot"
          git config user.email "salvian-ai-bot@users.noreply.github.com"
          git add app/api/music/route.ts
          git rm .github/workflows/run-music-lock-script.yml || true
          git commit -m "lock Music 2.5 and Suno style vocal qasidah" || true
          git push origin HEAD:main
      - run: npm run build
