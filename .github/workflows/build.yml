name: Build SALVIAN AI MUSIC

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup-authless-music:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Permanently remove legacy login wiring
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .authless-music-cleanup.done ]; then
            echo 'Authless Music cleanup already completed.'
            exit 0
          fi
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(p): return Path(p).read_text()
          def write(p, s): Path(p).write_text(s)

          # The Music Studio uses a device-local workspace id, never an account session.
          p = Path('components/premium-music-studio.tsx')
          s = read(p)
          s = s.replace('import { createClient, BetterAuthVanillaAdapter } from "@neondatabase/neon-js";\n', '')
          s = re.sub(r'const AUTH = .*?\nconst DATA = .*?\nconst neon = .*?\n\n', '', s, count=1, flags=re.S)
          s = s.replace('const [token, setToken] = useState<string | null>(null);', 'const [workspaceId, setWorkspaceId] = useState("");')
          start = s.index('  const syncSession = async () => {')
          end = s.index('  const uploadFile = async ', start)
          replacement = '''  const ensureWorkspaceId = () => {\n    if (typeof window === "undefined") return "";\n    const key = "salvian_music_workspace";\n    let id = window.localStorage.getItem(key);\n    if (!id) { id = crypto.randomUUID(); window.localStorage.setItem(key, id); }\n    setWorkspaceId(id);\n    return id;\n  };\n\n  const workspaceHeaders = () => ({ "X-Music-Workspace": workspaceId || ensureWorkspaceId() });\n\n  const loadLibrary = async () => {\n    const id = workspaceId || ensureWorkspaceId();\n    if (!id) return;\n    const res = await fetch("/api/projects", { headers: { "X-Music-Workspace": id }, cache: "no-store" });\n    const data = await res.json().catch(() => ({}));\n    if (res.ok) setProjects(Array.isArray(data.projects) ? data.projects.map(projectFromRow) : []);\n  };\n\n  useEffect(() => {\n    ensureWorkspaceId();\n    void loadLibrary();\n  }, []);\n\n  useEffect(() => { if (active === "library") void loadLibrary(); }, [active, workspaceId]);\n\n'''
          s = s[:start] + replacement + s[end:]
          s = re.sub(r'\n    if \(!token\) \{ setNotice\("Workspace sedang menunggu session induk SALVIAN AI\."\); void syncSession\(\); return; \}', '', s)
          s = s.replace('headers: { Authorization: `Bearer ${token}` }', 'headers: workspaceHeaders()')
          # Any remaining legacy session wording/calls are forbidden in Music.
          s = s.replace('void syncSession();', 'void ensureWorkspaceId();')
          if any(x in s for x in ['@neondatabase/neon-js', 'neon.auth', 'BetterAuthVanillaAdapter', 'Authorization: `Bearer ${token}`', 'syncSession', 'Session induk SALVIAN AI']):
              raise SystemExit('premium-music-studio still contains legacy auth wiring')
          write(p, s)

          # API routes use the device-local workspace header, not Bearer/JWT authentication.
          p = Path('app/api/music/route.ts'); s = read(p)
          s = s.replace('  const auth = request.headers.get("authorization");\n', '  const workspaceId = request.headers.get("x-music-workspace")?.trim() || "";\n')
          s = s.replace('  const action = body?.action || "generate";\n', '  const action = body?.action || "generate";\n')
          s = re.sub(r'\nfunction subject\(auth: string\): string \| null \{.*?\n\}\n', '\n', s, flags=re.S)
          s = s.replace('async function saveProject(auth: string, body:', 'async function saveProject(workspaceId: string, body:')
          s = re.sub(r'  const userId = subject\(auth\);\n  if \(!userId\) return \{ ok: false, data: null \};', '  const userId = workspaceId;\n  if (!userId) return { ok: false, data: null };', s)
          s = s.replace('Authorization: auth, ', '')
          s = s.replace('async function patchProject(auth: string, taskId:', 'async function patchProject(workspaceId: string, taskId:')
          s = re.sub(r'  const userId = subject\(auth\);\n  if \(!userId\) return null;', '  const userId = workspaceId;\n  if (!userId) return null;', s)
          s = s.replace('    if (!auth || !/^Bearer\\s+/i.test(auth)) return NextResponse.json({ success: false, error: "Sesi induk SALVIAN AI belum tersedia." }, { status: 401 });\n', '    if (!workspaceId) return NextResponse.json({ success: false, error: "Workspace Music belum siap." }, { status: 400 });\n')
          s = s.replace('const userId = subject(auth);', 'const userId = workspaceId;')
          s = s.replace('patchProject(auth, taskId', 'patchProject(workspaceId, taskId')
          s = s.replace('saveProject(auth, {', 'saveProject(workspaceId, {')
          if 'Authorization: auth' in s or 'subject(auth)' in s or 'Bearer\\s+' in s or 'Sesi induk SALVIAN AI' in s:
              raise SystemExit('music route still contains legacy auth wiring')
          write(p, s)

          p = Path('app/api/music/instrumental/route.ts'); s = read(p)
          s = s.replace('  const auth = request.headers.get("authorization");\n', '  const workspaceId = request.headers.get("x-music-workspace")?.trim() || "";\n')
          s = re.sub(r'\nfunction subject\(auth: string\) \{.*?\n\}\n', '\n', s, flags=re.S)
          s = s.replace('async function saveLibrary(auth: string, body:', 'async function saveLibrary(workspaceId: string, body:')
          s = re.sub(r'  const uid = subject\(auth\);\n  if \(!uid\) return \{ ok: false, data: null \};', '  const uid = workspaceId;\n  if (!uid) return { ok: false, data: null };', s)
          s = s.replace('Authorization: auth, ', '')
          s = s.replace('async function patchLibrary(auth: string, id:', 'async function patchLibrary(workspaceId: string, id:')
          s = re.sub(r'  const userId = subject\(auth\);\n  if \(!userId\) return null;', '  const userId = workspaceId;\n  if (!userId) return null;', s)
          s = s.replace('  const auth = request.headers.get("authorization");\n  if (!auth || !/^Bearer\\s+/i.test(auth)) return NextResponse.json({ success: false, error: "Sesi induk SALVIAN AI belum tersedia." }, { status: 401 });\n', '')
          s = s.replace('ownsMusicTaskServer(uid, id)', 'ownsMusicTaskServer(workspaceId, id)')
          s = s.replace('patchLibrary(auth, id', 'patchLibrary(workspaceId, id')
          s = s.replace('saveLibrary(auth, {', 'saveLibrary(workspaceId, {')
          if 'Authorization: auth' in s or 'subject(auth)' in s or 'Bearer\\s+' in s or 'Sesi induk SALVIAN AI' in s:
              raise SystemExit('instrumental route still contains legacy auth wiring')
          write(p, s)

          # Projects API is scoped only by the local Music workspace id.
          p = Path('app/api/projects/route.ts')
          write(p, '''import { NextRequest, NextResponse } from "next/server";\nimport { listMusicProjectsServer, deleteMusicProjectServer } from "../../../lib/server-music-projects";\n\nexport const runtime = "nodejs";\n\nfunction workspace(request: NextRequest) {\n  return request.headers.get("x-music-workspace")?.trim() || "";\n}\n\nexport async function GET(request: NextRequest) {\n  const userId = workspace(request);\n  if (!userId) return NextResponse.json({ success: false, error: "Workspace Music belum siap." }, { status: 400 });\n  try {\n    const projects = await listMusicProjectsServer(userId);\n    return NextResponse.json({ success: true, projects });\n  } catch (error) {\n    console.error("MUSIC LIBRARY SERVER READ ERROR", error);\n    return NextResponse.json({ success: false, error: error instanceof Error ? error.message : "Gagal mengambil Library." }, { status: 500 });\n  }\n}\n\nexport async function DELETE(request: NextRequest) {\n  const userId = workspace(request);\n  if (!userId) return NextResponse.json({ success: false, error: "Workspace Music belum siap." }, { status: 400 });\n  const id = request.nextUrl.searchParams.get("id");\n  if (!id) return NextResponse.json({ success: false, error: "ID project belum dikirim." }, { status: 400 });\n  try {\n    const deleted = await deleteMusicProjectServer(userId, id);\n    if (!deleted) return NextResponse.json({ success: false, error: "Project tidak ditemukan." }, { status: 404 });\n    return NextResponse.json({ success: true });\n  } catch (error) {\n    return NextResponse.json({ success: false, error: error instanceof Error ? error.message : "Gagal menghapus project." }, { status: 500 });\n  }\n}\n''')

          # Add a scoped delete operation to the existing Neon database helper. This is database access, not user auth.
          p = Path('lib/server-music-projects.ts'); s = read(p)
          if 'deleteMusicProjectServer' not in s:
              s += '''\n\nexport async function deleteMusicProjectServer(userId: string, id: string) {\n  if (!userId || !id) return false;\n  const sql = getSql();\n  const rows = await sql`DELETE FROM public.salvian_music_projects WHERE user_id = ${userId} AND id = ${id} RETURNING id`;\n  return rows.length > 0;\n}\n'''
          write(p, s)

          # Remove the compatibility auth shim and its webpack alias.
          Path('lib/neon-authless-shim.ts').unlink(missing_ok=True)
          write(Path('next.config.mjs'), 'export default {};\n')

          # Neon JS was only present for the deleted client-side auth flow.
          import json
          pkg = json.loads(read('package.json'))
          pkg['dependencies'].pop('@neondatabase/neon-js', None)
          write('package.json', json.dumps(pkg, indent=2) + '\n')

          # Mark completion so this cleanup job becomes inert on subsequent pushes.
          Path('.authless-music-cleanup.done').write_text('SALVIAN AI MUSIC authless cleanup complete.\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/premium-music-studio.tsx app/api/music/route.ts app/api/music/instrumental/route.ts app/api/projects/route.ts lib/server-music-projects.ts lib/neon-authless-shim.ts next.config.mjs package.json .authless-music-cleanup.done
          if git diff --cached --quiet; then
            echo 'No cleanup changes required.'
            exit 0
          fi
          git commit -m 'Permanently remove Music login and auth flow'
          git push

  build:
    needs: cleanup-authless-music
    if: always() && (needs.cleanup-authless-music.result == 'success' || needs.cleanup-authless-music.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
