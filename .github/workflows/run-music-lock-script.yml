name: Run music lock script
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Run music lock script')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply existing verified patch script
        run: node scripts/patch-eleven-music.mjs
      - name: Commit patch
        run: |
          git config user.name "salvian-ai-bot"
          git config user.email "salvian-ai-bot@users.noreply.github.com"
          git add app/api/music/route.ts
          git rm .github/workflows/run-music-lock-script.yml
          git commit -m "lock Music 2.5 and Suno style vocal qasidah"
          git push origin HEAD:main
