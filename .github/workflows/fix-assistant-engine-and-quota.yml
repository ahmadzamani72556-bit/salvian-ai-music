name: Fix Music Assistant Gemini engine and quota path

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Apply quota DDL fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove request-time DDL from existing quota path
        shell: python
        run: |
          from pathlib import Path
          quota = Path('lib/assistant-daily-limit.ts')
          text = quota.read_text()
          text = text.replace('  await ensureTable();\n  const key = await quotaKey(request);', '  const key = await quotaKey(request);')
          quota.write_text(text)
      - name: Commit quota fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add lib/assistant-daily-limit.ts
          git commit -m 'Remove runtime DDL from Music Assistant quota'
          git push
