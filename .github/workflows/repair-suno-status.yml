name: Repair Suno status payload

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'trigger: repair Suno')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded Suno fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('app/api/music/route.ts')
          s = p.read_text()
          old_status = 'body: JSON.stringify({ song_ids: [taskId], model: "suno-v6" })'
          new_status = 'body: JSON.stringify({ song_ids: taskId, model: "suno-v6" })'
          if s.count(old_status) != 1:
              raise SystemExit(f'Expected exactly one Suno status payload, found {s.count(old_status)}')
          s = s.replace(old_status, new_status)
          old_custom = 'style_tags: premiumDirective || "pop, modern, emotional"'
          new_custom = 'style_tags: (premiumDirective || "pop, modern, emotional").slice(0, 1000)'
          if s.count(old_custom) != 1:
              raise SystemExit(f'Expected exactly one Suno custom style payload, found {s.count(old_custom)}')
          s = s.replace(old_custom, new_custom)
          p.write_text(s)
          PY
          git diff --check
          git diff -- app/api/music/route.ts
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-suno-status.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/api/music/route.ts .github/workflows/repair-suno-status.yml
          git commit -m 'fix(suno): correct status payload and style length'
          git push
