name: Fix full-screen AI assistant

# Force a fresh main-branch push event so the patch job runs.
# The actual UI change is made by this workflow in premium-music-studio.tsx.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[fullscreen-assistant-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch assistant overlay
        shell: python
        run: |
          from pathlib import Path
          p = Path('components/premium-music-studio.tsx')
          s = p.read_text()
          if 'fixed inset-0 z-[100] flex h-[100dvh] w-screen' in s:
              print('already fullscreen')
          else:
              start = s.find('{chatOpen && <div className="fixed bottom-4 right-4')
              if start < 0:
                  raise SystemExit('old assistant panel not found')
              pos = start
              depth = 0
              end = -1
              while pos < len(s):
                  if s.startswith('<div', pos):
                      depth += 1
                  elif s.startswith('</div>', pos):
                      depth -= 1
                      if depth == 0:
                          end = pos + len('</div>')
                          if end < len(s) and s[end] == '}':
                              end += 1
                          break
                  pos += 1
              if end < 0:
                  raise SystemExit('assistant panel boundary not found')
              new = '''{chatOpen ? <div className="fixed inset-0 z-[100] flex h-[100dvh] w-screen flex-col overflow-hidden bg-[#05050c] text-white">
        <div className="flex shrink-0 items-center justify-between border-b border-white/10 bg-[#070812]/95 px-4 py-4 backdrop-blur-xl sm:px-7">
          <div className="flex items-center gap-3"><div className="rounded-2xl bg-violet-500/15 p-2.5"><Bot size={22} className="text-violet-300"/></div><div><div className="text-lg font-black">Asisten AI</div><div className="text-[10px] tracking-[.22em] text-zinc-500">SALVIAN AI MUSIC</div></div></div>
          <button aria-label="Kembali ke Studio Musik" onClick={() => setChatOpen(false)} className="rounded-2xl border border-white/10 bg-white/5 px-4 py-2.5 text-sm font-bold text-zinc-200 hover:bg-white/10"><X size={18} className="mr-2 inline"/>Kembali</button>
        </div>
        <div className="mx-auto flex w-full max-w-5xl min-h-0 flex-1 flex-col px-4 py-5 sm:px-7 sm:py-7">
          <div className="min-h-0 flex-1 overflow-y-auto rounded-3xl border border-white/10 bg-white/[.025] p-4 sm:p-7">
            <div className="mx-auto max-w-4xl space-y-5">{messages.map((m,i)=><div key={i} className={m.role === "user" ? "ml-auto max-w-[90%] rounded-3xl bg-violet-500/15 p-4 text-sm leading-7" : "max-w-[95%] rounded-3xl bg-white/5 p-4 text-sm leading-7 text-zinc-200"}>{m.content}</div>)}{chatBusy && <div className="rounded-3xl bg-white/5 p-4 text-sm text-zinc-500">Asisten sedang mengetik…</div>}</div>
          </div>
          <form onSubmit={ask} className="mx-auto mt-4 flex w-full max-w-4xl gap-3 rounded-3xl border border-white/10 bg-white/[.04] p-3 shadow-2xl">
            <textarea value={chatInput} onChange={e => setChatInput(e.target.value)} onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); void ask(); } }} rows={3} placeholder="Tulis lirik, konsep musik, ide lagu, atau apa pun yang ingin kamu minta…" className="min-h-[76px] min-w-0 flex-1 resize-none bg-transparent px-3 py-2 text-sm leading-6 outline-none placeholder:text-zinc-600"/>
            <button type="submit" disabled={chatBusy || !chatInput.trim()} className="self-end rounded-2xl bg-white px-4 py-3 font-bold text-black disabled:opacity-30"><Send size={18}/></button>
          </form>
        </div>
      </div> : null}'''
              p.write_text(s[:start] + new + s[end:])
              print('assistant panel replaced')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/premium-music-studio.tsx
          git commit -m "fix: full-screen AI assistant overlay [fullscreen-assistant-patch]" || exit 0
          git push