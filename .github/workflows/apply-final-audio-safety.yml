name: Apply final audio safety patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch streaming URL handling
        run: |
          python - <<'PY'
          from pathlib import Path

          music = Path('app/api/music/route.ts')
          s = music.read_text()
          old = '["audio_url", "audioUrl", "wav_url", "wavUrl", "song_url", "songUrl", "music_url", "musicUrl", "output_url", "outputUrl", "download_url", "downloadUrl", "stream_url", "streamUrl"]'
          new = '["audio_url", "audioUrl", "wav_url", "wavUrl", "song_url", "songUrl", "music_url", "musicUrl", "output_url", "outputUrl", "download_url", "downloadUrl"]'
          if old not in s:
              raise SystemExit('music final-url key list not found')
          s = s.replace(old, new, 1)
          marker = 'function findTaskId(value: unknown): string | null {'
          helper = '''function findStreamAudio(value: unknown, depth = 0): string | null {\n  if (!value || depth > 8) return null;\n  if (typeof value === "string") return null;\n  if (Array.isArray(value)) { for (const item of value) { const found = findStreamAudio(item, depth + 1); if (found) return found; } return null; }\n  if (typeof value !== "object") return null;\n  const obj = value as Record<string, unknown>;\n  for (const key of ["stream_url", "streamUrl"]) { const found = cleanUrl(obj[key]); if (found) return found; }\n  for (const key of ["audio", "choices", "songs", "outputs", "results", "data"]) { if (obj[key]) { const found = findStreamAudio(obj[key], depth + 1); if (found) return found; } }\n  return null;\n}\n'''
          if helper not in s:
              s = s.replace(marker, helper + marker, 1)
          old_status = 'const status = findStatus(q.data); const bad = failure(status); const providerModel = findString(q.data, ["model"]); const traceId = findString(q.data, ["trace_id", "traceId"]); const failedReason = findString(q.data, ["failed_reason", "failedReason"]); const audio = !bad ? findAudio(q.data) : null; const done = terminal(status) || Boolean(audio); try { const patch = await patchProject(auth, taskId, done && audio ? "succeeded" : status, audio, q.data); if (!patch) console.error("MUSIC LIBRARY STATUS ERROR: project not found"); } catch (e) { console.error("MUSIC LIBRARY STATUS ERROR", e); }'
          new_status = 'const status = findStatus(q.data); const bad = failure(status); const providerModel = findString(q.data, ["model"]); const traceId = findString(q.data, ["trace_id", "traceId"]); const failedReason = findString(q.data, ["failed_reason", "failedReason"]); const audio = !bad ? findAudio(q.data) : null; const streamAudio = !bad ? findStreamAudio(q.data) : null; const done = terminal(status); try { const patch = await patchProject(auth, taskId, done && audio ? "succeeded" : status, audio, q.data); if (!patch) console.error("MUSIC LIBRARY STATUS ERROR: project not found"); } catch (e) { console.error("MUSIC LIBRARY STATUS ERROR", e); }'
          if old_status not in s:
              raise SystemExit('music status block not found')
          s = s.replace(old_status, new_status, 1)
          old_json = 'audio, url: audio, finished: done, failed: bad'
          new_json = 'audio, url: audio, streamUrl: streamAudio, finished: done, failed: bad'
          if old_json not in s:
              raise SystemExit('music response audio block not found')
          s = s.replace(old_json, new_json, 1)
          music.write_text(s)

          inst = Path('app/api/music/instrumental/route.ts')
          s = inst.read_text()
          old = '["audio_url", "audioUrl", "wav_url", "wavUrl", "song_url", "songUrl", "music_url", "musicUrl", "output_url", "outputUrl", "download_url", "downloadUrl", "stream_url", "streamUrl", "url"]'
          new = '["audio_url", "audioUrl", "wav_url", "wavUrl", "song_url", "songUrl", "music_url", "musicUrl", "output_url", "outputUrl", "download_url", "downloadUrl", "url"]'
          if old not in s:
              raise SystemExit('instrumental final-url key list not found')
          s = s.replace(old, new, 1)
          marker = 'function terminal(s: string) {'
          helper = '''function streamAudio(data: unknown): string | null {\n  if (!data || typeof data !== "object") return null;\n  if (Array.isArray(data)) { for (const x of data) { const a = streamAudio(x); if (a) return a; } return null; }\n  const o = data as Record<string, unknown>;\n  for (const k of ["stream_url", "streamUrl"]) { if (typeof o[k] === "string" && /^(https?:\\/\\/|data:|blob:)/i.test(o[k] as string)) return o[k] as string; }\n  for (const k of ["audio", "choices", "songs", "outputs", "results", "data"]) { const a = streamAudio(o[k]); if (a) return a; }\n  return null;\n}\n'''
          if helper not in s:
              s = s.replace(marker, helper + marker, 1)
          old_status = 'const a = !bad ? audio(q.data) : null;\n      const done = terminal(s) || Boolean(a);\n      const normalizedStatus = done && a ? "succeeded" : s;'
          new_status = 'const a = !bad ? audio(q.data) : null;\n      const streamUrl = !bad ? streamAudio(q.data) : null;\n      const done = terminal(s);\n      const normalizedStatus = done && a ? "succeeded" : s;'
          if old_status not in s:
              raise SystemExit('instrumental status block not found')
          s = s.replace(old_status, new_status, 1)
          old_json = 'audio: a, url: a, finished: done'
          new_json = 'audio: a, url: a, streamUrl, finished: done'
          if old_json not in s:
              raise SystemExit('instrumental response audio block not found')
          s = s.replace(old_json, new_json, 1)
          inst.write_text(s)
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/music/route.ts app/api/music/instrumental/route.ts
          git diff --cached --quiet && exit 0
          git commit -m "Fix streaming URL from being treated as final audio"
          git push
          git rm .github/workflows/apply-final-audio-safety.yml
          git commit -m "Remove one-time final audio safety workflow"
          git push
