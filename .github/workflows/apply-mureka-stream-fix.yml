name: Apply Mureka stream fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply stream transport fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('components/premium-music-studio.tsx')
          s = p.read_text()
          old = 'n: 1, instrumental, gender'
          new = 'n: 1, stream: true, instrumental, gender'
          if old in s and new not in s:
              s = s.replace(old, new, 1)
              p.write_text(s)

          p = Path('app/api/music/instrumental/route.ts')
          s = p.read_text()
          s = s.replace('n: 1, stream: false', 'n: 1, stream: true', 1)
          p.write_text(s)

          p = Path('app/api/music/route.ts')
          s = p.read_text()
          s = s.replace('const stream = body?.stream === true;', 'const stream = body?.stream !== false;', 1)
          p.write_text(s)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/premium-music-studio.tsx app/api/music/instrumental/route.ts app/api/music/route.ts
          if git diff --cached --quiet; then
            echo 'No stream changes needed.'
          else
            git commit -m 'Enable Mureka streaming for music generation'
            git push
          fi
      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/apply-mureka-stream-fix.yml || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove temporary Mureka stream patch workflow'
          git push
