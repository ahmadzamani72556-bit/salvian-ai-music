name: Apply universal music locks
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Apply universal music locks')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Music 2.5 and Suno directives
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess
          p = Path('app/api/music/route.ts')
          s = p.read_text()
          def rep(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'patch anchor not found: {label}')
              s = s.replace(old, new, 1)

          rep('''  if (/dj|edm|electronic/.test(s)) add("DJ/electronic rhythmic production");
  if (tempo > 0) add(`${tempo} BPM`);
  add("crystal-clear lead vocal", "bright warm full-bodied vocal", "clean controlled vibrato", "tasteful melisma and cengkok", "punchy clean low end", "clear separated mids", "open non-harsh highs", "modern polished commercial mix");''', '''  if (/dj|edm|electronic/.test(s)) add("DJ/electronic rhythmic production");
  if (/qasidah|sholawat|selawat|religi|islami|islamic/.test(s)) add("deep devotional qasidah", "sholawat melodic phrasing", "Arabic/Islamic melodic ornamentation", "rebana and frame-drum pulse", "reverent devotional cadence");
  if (/dangdut/.test(s)) add("authentic Indonesian dangdut groove", "kendang dangdut rhythm", "dangdut vocal cengkok", "ornamental dangdut melisma", "punchy kendang fills");
  if (tempo > 0) add(`${tempo} BPM`);
  add("crystal-clear lead vocal", "bright warm full-bodied vocal", "clean controlled vibrato", "style-appropriate melodic ornamentation", "punchy clean low end", "clear separated mids", "open non-harsh highs", "modern polished commercial mix");''', 'style positives')

          rep('''  if (!/dangdut/.test(s)) negative.add("dangdut");
  if (instrumental) negative.add("lead vocals and lyrics");''', '''  if (!/dangdut/.test(s)) negative.add("dangdut");
  if (!/qasidah|sholawat|selawat|religi|islami|islamic/.test(s)) {
    negative.add("qasidah devotional music");
    negative.add("Islamic devotional chant");
    negative.add("rebana/frame-drum ensemble");
  }
  if (!/dangdut/.test(s)) {
    negative.add("dangdut kendang groove");
    negative.add("dangdut cengkok vocals");
  }
  negative.add("generic band arrangement");
  negative.add("straight pop band");
  negative.add("rock band");
  negative.add("flat band-style vocals");
  if (instrumental) negative.add("lead vocals and lyrics");''', 'style negatives')

          rep('''  const vocalId = String(body.vocal_id || "").trim();
  const styleTokens = requestedStyleTokens(rawStyle, tempo, instrumental);''', '''  const vocalId = String(body.vocal_id || "").trim();
  const lyrics = String(body.lyrics || "");
  const hasArabicLyrics = /[\\u0600-\\u06FF]/.test(lyrics);
  const styleTokens = requestedStyleTokens(rawStyle, tempo, instrumental);''', 'arabic detection')

          rep('''    "VOCAL EXPRESSION: natural confident singing with beautiful melodic dangdut-style cengkok and tasteful melisma/vibrato where appropriate. Cengkok decorates sustained vowels and never obscures lyric words. Vocal is merdu, lantang, terang, emotional and controlled, never harsh.",
    "QASIDAH/SHOLAWAT LOCK: if qasidah, sholawat, religi or Islami is requested, the Islamic devotional identity must be obvious and deep in the melody, phrasing, ornamentation, cadence and atmosphere. Do not turn it into generic pop or unrelated dance music.",
    "DANGDUT SHOLAWAT LOCK: if dangdut + sholawat/religi is requested, keep strong dangdut groove, kendang-style accents, bass/kick drive, fills and melodic ornaments while the sholawat melodic identity stays prominent. If slow is requested, remain slow and devotional.",''', '''    "VOCAL EXPRESSION LOCK: never use a flat generic band-style vocal. Use a confident, merdu, lantang, bening and terang lead vocal with natural breath, controlled vibrato, expressive dynamics, tasteful melisma and style-appropriate ornamentation. When dangdut is requested, use authentic dangdut cengkok and ornamental turns; cengkok must decorate sustained vowels without hiding consonants or lyric words.",
    "QASIDAH/SHOLAWAT LOCK: when qasidah, sholawat, religi or Islami is requested, make the devotional identity unmistakable and emotionally deep in the melody, cadence, ornamentation and atmosphere: qasidah melodic movement, Arabic/Islamic phrasing, rebana/frame-drum colors and reverent call-and-response feeling. Never default to a generic pop/rock band.",
    "DANGDUT SHOLAWAT LOCK: when dangdut + sholawat/religi is requested, the rhythm must unmistakably sound dangdut: kendang-led groove, syncopated dangdut bass, punchy kick, tasteful fills and rhythmic breaks, with the sholawat/qasidah melody as the emotional center. If slow is requested, keep the dangdut-sholawat identity slow, deep and devotional rather than turning into a pop ballad.",
    hasArabicLyrics ? "ARABIC LYRIC DICTION LOCK: sing every supplied Arabic word exactly and in order. Preserve supplied spelling and word boundaries; use clear Arabic makhraj, distinct consonants, accurate vowels, clean syllable timing and audible word endings. Never transliterate, translate, rewrite, merge, invent, omit or blur Arabic words into Indonesian-sounding phonemes." : "",''', 'premium vocal locks')

          rep('''function enforceElevenPlan(plan: any, body: Record<string, unknown>) {''', '''function normalizeElevenCompositionPlan(plan: any) {
  if (!plan || typeof plan !== "object") return plan;
  const { music_length_ms: _musicLengthMs, model_id: _modelId, prompt: _prompt, ...cleanPlan } = plan;
  return cleanPlan;
}

function enforceElevenPlan(plan: any, body: Record<string, unknown>) {''', 'plan sanitizer')

          rep('''  const lyrics = String(body.lyrics || "").trim();
  const lines = instrumental ? [] : lyrics.split(/\\r?\\n/).map(x => x.trim()).filter(Boolean);
  const chunks = plan.chunks.map((chunk: any, index: number) => {''', '''  const lyrics = String(body.lyrics || "").trim();
  const hasArabicLyrics = /[\\u0600-\\u06FF]/.test(lyrics);
  const lines = instrumental ? [] : lyrics.split(/\\r?\\n/).map(x => x.trim()).filter(Boolean);
  const chunks = plan.chunks.map((chunk: any, index: number) => {''', 'plan arabic detection')

          rep('''    const mergedPositive = [...locks.positive.slice(0, index === 0 ? 16 : 10), ...positive].filter((v, i, a) => a.indexOf(v) === i).slice(0, 50);
    const mergedNegative = [...locks.negative, ...negative].filter((v, i, a) => a.indexOf(v) === i).slice(0, 50);''', '''    const arabicPositive = hasArabicLyrics ? ["clear Arabic diction", "accurate Arabic makhraj", "distinct Arabic consonants and vowels", "audible Arabic word endings"] : [];
    const arabicNegative = hasArabicLyrics ? ["mumbled Arabic", "blurred Arabic syllables", "mispronounced Arabic", "foreign-language drift"] : [];
    const mergedPositive = [...locks.positive.slice(0, index === 0 ? 16 : 10), ...arabicPositive, ...positive].filter((v, i, a) => a.indexOf(v) === i).slice(0, 50);
    const mergedNegative = [...locks.negative, ...arabicNegative, ...negative].filter((v, i, a) => a.indexOf(v) === i).slice(0, 50);''', 'plan locks')

          rep('''  const compositionPlan = planResponse.ok && Array.isArray(planData?.chunks) ? enforceElevenPlan(planData, body) : null;''', '''  const compositionPlan = planResponse.ok && Array.isArray(planData?.chunks) ? normalizeElevenCompositionPlan(enforceElevenPlan(planData, body)) : null;''', 'compose plan')

          p.write_text(s)
          subprocess.run(['git','config','user.name','salvian-ai-bot'], check=True)
          subprocess.run(['git','config','user.email','salvian-ai-bot@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','app/api/music/route.ts'], check=True)
          subprocess.run(['git','rm','.github/workflows/patch-eleven-music-25.yml'], check=True)
          subprocess.run(['git','rm','.github/workflows/apply-universal-music-locks.yml'], check=True)
          subprocess.run(['git','commit','-m','lock Music 2.5 and Suno style vocal qasidah'], check=True)
          subprocess.run(['git','push','origin','HEAD:main'], check=True)
          PY
